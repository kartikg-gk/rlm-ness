primary_agent: z-ai/glm-5
# Children run on a cheaper model than the root. Delegating then costs
# less than doing the same work yourself, which is the difference
# between recursion being allowed and recursion being worth it. Both
# reach through the same key, so this needs no extra setup.
sub_agent: minimax/minimax-m2.5
max_steps: 20
truncate_len: 2000
timeout: 120
max_depth: 3
max_calls: 400
max_cost: 1.0
max_concurrent: 16
max_live: 32
runtime: subprocess
api_max_retries: 3
api_backoff: 0.5
temperature: 0.1
reasoning_effort: low
enable_step_banner: false
max_seconds: 1800
max_completion_tokens: 500000
max_prompt_tokens: 2000000
