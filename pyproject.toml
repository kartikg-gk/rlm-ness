[project]
name = "rlmness"
version = "0.2.1"
description = "A Recursive Language Model runtime: the model works on your input through code, and hands pieces to sub-agents of itself."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["llm", "agents", "long-context", "repl", "recursive-language-models"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.18",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The dashboard is a viewer over the run, never part of running one.
tui = ["textual>=0.80"]

[project.urls]
Source = "https://github.com/kartikg-gk/rlm-ness"
Paper = "https://arxiv.org/abs/2512.24601"

[project.scripts]
rlmness = "rlmness.console:main"
rlmness-viewlog = "rlmness.viewlog:main"
rlmness-timeline = "rlmness.timeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rlmness"]

[tool.setuptools.package-data]
rlmness = ["wasm_guest.mjs"]

[tool.pytest.ini_options]
# No testpaths: the suite is not part of what is published, so naming a
# directory here makes a plain `pytest` fail on a fresh checkout for want of
# a path that was never shipped.
