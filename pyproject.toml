[project]
name = "rlm-ness"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Reserved for benchmark sets that ship no plain archive.
evals = ["datasets>=2.14"]

[project.scripts]
rlmness = "rlmness.console:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["rlmness", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
